<svg xmlns="http://www.w3.org/2000/svg" width="162" height="42" viewBox="0 0 162 42" role="img" aria-label="PORTFOLIO">
<defs>
  <linearGradient id="fillG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#171327"/>
    <stop offset="100%" stop-color="#100d1c"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="1" y="1" width="160" height="40" rx="12"/></clipPath>
</defs>
<style>
  text { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif; }
  .shine { transform-box: view-box; animation: slide 5.5s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-90px); } 55%, 100% { transform: translateX(202px); } }
  .brd { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: .95; } }
</style>
<rect x="1" y="1" width="160" height="40" rx="12" fill="url(#fillG)"/>
<g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="70" height="42" fill="url(#shine)"/></g>
<rect class="brd" x="1" y="1" width="160" height="40" rx="12" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
<g transform="translate(27 21.0)"><g stroke="#22D3EE" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="8"/>
      <ellipse cx="0" cy="0" rx="3.4" ry="8"/>
      <path d="M-8 -2.6h16M-8 2.6h16"/>
    </g></g>
<text x="48" y="26" font-size="13" font-weight="700" letter-spacing="1.5" fill="#E9E3FF">PORTFOLIO</text>
</svg>
