<svg xmlns="http://www.w3.org/2000/svg" width="112" height="42" viewBox="0 0 112 42" role="img" aria-label="email">
<defs>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c141a"/><stop offset="1" stop-color="#070d12"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9BE7C4" stop-opacity=".85"/>
    <stop offset="0.55" stop-color="#8FD4F5" stop-opacity=".7"/>
    <stop offset="1" stop-color="#B9A7FA" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8F5E8"/><stop offset="1" stop-color="#BFE6FA"/>
  </linearGradient>
</defs>
<style>
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .edge { animation: breathe 5s ease-in-out infinite; }
