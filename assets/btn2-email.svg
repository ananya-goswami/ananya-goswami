</style>
<rect x="1" y="1" width="110" height="40" rx="11" fill="url(#fill)"/>
<rect class="edge" x="1" y="1" width="110" height="40" rx="11" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
<g transform="translate(30 21)" fill="none" stroke="#8FD4F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5"/><path d="M-9 -5.2 0 1.6 9 -5.2"/></g>
<text class="mono" x="50" y="26" font-size="14" font-weight="600" fill="url(#ink)" letter-spacing=".4">email</text>
</svg>
