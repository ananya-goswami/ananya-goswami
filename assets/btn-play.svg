<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" role="img" aria-label="PLAY THE GAME">
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8F5E8"/><stop offset="1" stop-color="#BFE6FA"/>
  </linearGradient>
</defs>
<style>
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .rule { animation: glow 2.4s ease-in-out infinite; }
  .tri { animation: nudge 1.2s ease-in-out infinite; transform-origin: 26px 24px; }
  @keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(2px) } }
</style>
<rect x="0.75" y="0.75" width="198.5" height="46.5" rx="11" fill="#0b1219" stroke="#20D898" stroke-opacity=".55" stroke-width="1.5"/>
