<svg xmlns="http://www.w3.org/2000/svg" width="112" height="40" viewBox="0 0 112 40" role="img" aria-label="./email  ">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#08110e"/><stop offset="100%" stop-color="#050b09"/>
  </linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="110" height="38" rx="8"/></clipPath>
</defs>
<style>
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }
  .brd { animation: glow 3.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { stroke-opacity: .40 } 50% { stroke-opacity: .95 } }
  .car { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%,48% { opacity: .9 } 49%,100% { opacity: .1 } }
</style>
<rect x="1" y="1" width="110" height="38" rx="8" fill="url(#g)"/>
<rect class="brd" x="1" y="1" width="110" height="38" rx="8" fill="none" stroke="#00FF9C" stroke-width="1.3"/>
<text class="mono" x="18" y="25" font-size="14" font-weight="600" fill="#00FF9C" xml:space="preserve">./email  </text>
<rect class="car" x="99" y="13" width="6" height="14" fill="#00FF9C" fill-opacity=".55"/>
</svg>
