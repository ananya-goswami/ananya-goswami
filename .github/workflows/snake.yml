name: Generate snake animation and high scores

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ananya-goswami
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Build high scores panel
        run: |
          sudo chown -R "$USER" dist
          python3 -m pip install --quiet --upgrade pillow numpy
          python3 .github/scripts/make_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cards' language percentages live in the README's title= attributes,
      # because that is the only place on a GitHub profile that can react to a
      # pointer.  make_stats.py rewrites them from the same index it draws the
      # rings from, so they have to be committed back to main to stay true.
      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop.  The checkout is detached on a push event, hence
      # HEAD:main; if main has moved on meanwhile the push is skipped rather
      # than failing the build, and the next run picks it up.
      - name: Refresh the README's language tooltips
        run: |
          if [ -z "$(git status --porcelain readme.md)" ]; then
            echo "readme.md unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git commit -m "Refresh the project cards' language tooltips"
          git push origin HEAD:main || echo "push skipped; main has moved on"

      - name: Push generated art to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
